<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIKI REVEAL - Le Jeu de Découverte</title>
    <meta name="description" content="Devinez la page Wikipédia cachée. Jeu solo, quotidien et multijoueur.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar glass">
            <div class="logo">
                <i class="fa-brands fa-wikipedia-w"></i>
                <span>WIKI<span class="highlight">REVEAL</span></span>
            </div>
            <div class="nav-links">
                <button class="nav-btn active" data-view="home">Accueil</button>
                <button class="nav-btn" data-view="daily">Défi Quotidien</button>
                <button class="nav-btn" data-view="solo">Mode Solo</button>
                <button class="nav-btn" data-view="multiplayer">Compétition</button>
            </div>
            <div class="user-profile" id="user-profile-btn">
                <span class="username">Invité</span>
                <div class="avatar-placeholder"><i class="fa-solid fa-user"></i></div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-container">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Floating Action / Input Area (Game Mode Only) -->
        <div id="game-controls" class="game-controls glass hidden">
            <div class="stats-bar">
                <div class="stat"><i class="fa-solid fa-bullseye"></i> <span id="accuracy">0%</span></div>
                <div class="stat"><i class="fa-solid fa-font"></i> <span id="word-count">0/0</span></div>
                <div class="stat timer hidden" id="game-timer"><i class="fa-solid fa-stopwatch"></i> <span>00:00</span></div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="guess-input" placeholder="Tapez un mot..." autocomplete="off">
                <button id="submit-guess"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Modals -->
        <div id="modal-container" class="modal-overlay hidden">
            <!-- Content injected via JS -->
        </div>
    </div>

    <!-- Firebase SDKs (Modular) -->
    <!-- We will use ES Modules in main.js -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
