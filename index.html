<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikigame</title>
    <link href="https://srn-romain.github.io/wikigame/favicon.webp" rel="icon">
    <meta name="description" content="Devinez la page Wikipédia cachée. Tous les mots sont masqués — tapez des mots pour les révéler et trouvez le titre de l'article.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#50644C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WikiGame">
    <link rel="apple-touch-icon" href="favicon.webp">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar glass">
            <div class="logo">
                <i class="fa-brands fa-wikipedia-w"></i>
                <span>WIKI<span style="color:var(--accent)">GAME</span></span>
            </div>
            <button id="mobile-menu-toggle" class="mobile-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="nav-links">
                <button class="nav-btn active" data-view="home">Accueil</button>
                <button class="nav-btn" data-view="daily">Défi Quotidien</button>
                <button class="nav-btn" data-view="solo">Mode Solo</button>
                <button class="nav-btn" data-view="multiplayer">Compétition</button>
                <button class="nav-btn" data-view="ranking">Classement</button>
                <button class="nav-btn" data-view="missions">Missions</button>
            </div>
            <div class="nav-actions" style="display:flex; align-items:center;">
                <div id="admin-nav-area"></div>
                <div class="user-profile" id="user-profile-btn">
                    <span class="username" style="color:var(--text-muted); font-size:0.85rem;">Invité</span>
                    <div class="avatar-placeholder"><i class="fa-solid fa-user" style="font-size:0.8rem;"></i></div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-container">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Floating Game Controls (visible during game) -->
        <div id="game-controls" class="game-controls glass hidden">
            <div class="stats-bar">
                <div class="stat">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>Essais&nbsp;: <span class="stat-value" id="stat-attempts">0</span></span>
                </div>
                <div class="stat">
                    <i class="fa-solid fa-font"></i>
                    <span>Mots&nbsp;: <span class="stat-value" id="stat-words">0/0</span></span>
                </div>
                <div class="stat">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span><span class="stat-value" id="stat-timer">00:00</span></span>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="guess-input" class="wiki-input" placeholder="Tapez un mot et validez…" autocomplete="off" spellcheck="false">
                <button id="submit-guess" title="Valider (Entrée)">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Modals -->
        <div id="modal-container" class="modal-overlay hidden">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
